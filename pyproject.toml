[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "act-backend"
version = "1.6"
description = "ACT: Compiler Backend Generator for Tensor Accelerator ISAs"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "ACT Compiler Team"},
]
readme = "README.md"
dependencies = [
    "taidl @ git+https://github.com/act-compiler/taidl.git@v2.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["act_backend*"]

[tool.setuptools.package-data]
"act_backend.templates" = ["*.txt"]
"act_backend.generic" = ["**/*", ".gitignore"]
